<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamber Inspection Log</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f8f9fa; color: #333; margin: 0; }
        .card { background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 600px; margin: auto; }
        h2 { margin-top: 0; color: #0056b3; font-size: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f1f3f5; }
        .note-box { background: #e9ecef; padding: 10px 15px; border-radius: 5px; font-size: 14px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Chamber Inspection - Asset #01</h2>
    <div class="note-box">
        <strong>Status:</strong> Visited post-MLX scan. Inlets and outlets documented visually from surface.
    </div>
    <table>
        <tr>
            <th>Connection Type</th>
            <th>Size / Material</th>
            <th>Notes</th>
        </tr>
        <tr>
            <td>Inlet (East)</td>
            <td>150mm PVC</td>
            <td>Clean run, active flow</td>
        </tr>
        <tr>
            <td>Outlet (West)</td>
            <td>300mm Concrete</td>
            <td>Main surface water run</td>
        </tr>
    </table>
    <p style="font-size: 12px; color: #666; text-align: center; margin-top: 20px;">Hosted live via GitHub Pages</p>
</div>

</body>
</html>
